<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=showroom.html">
    <title>3D Keycap Preview Moved | ForgeKeys AU</title>
    <meta name="description" content="Continue to the current ForgeKeys AU 3D Keycap Showroom to compare curated keycap sets, keyboard layouts, and case finishes.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://forgekeystudio.com.au/showroom.html">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="stylesheet" href="styles.css?v=switch-align">
    <script>
      (() => {
        const current = new URL(window.location.href);
        const target = new URL("showroom.html", current);
        current.searchParams.forEach((value, key) => target.searchParams.set(key, value));
        if (!target.searchParams.has("source")) target.searchParams.set("source", "legacy-preview");
        target.hash = current.hash;
        window.location.replace(target.href);
      })();
    </script>
  </head>
  <body>
    <main class="page">
      <section class="page-title" aria-live="polite">
        <p class="eyebrow">3D preview moved</p>
        <h1>Continue to the 3D Keycap Showroom.</h1>
        <p>The current showroom includes curated keycap sets, layouts, case finishes, and the interactive keyboard.</p>
        <a class="button primary" href="showroom.html?source=legacy-preview">Open 3D Showroom</a>
      </section>
    </main>
  </body>
</html>
